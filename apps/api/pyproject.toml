[project]
name = "rag-support-api"
version = "0.0.0"
requires-python = "==3.13.*"
dependencies = [
  "asyncpg==0.31.0",
  "pgvector==0.5.0",
  "sqlalchemy[asyncio]==2.0.51",
]

[project.optional-dependencies]
api = [
    "cloud-sql-python-connector[asyncpg]==1.21.0",
    "fastapi[standard-no-fastapi-cloud-cli]==0.141.1",
    "httpx==0.28.1",
    "pyjwt[crypto]==2.10.1",
    "rag-provider-adapters",
]
migrations = [
    "alembic==1.18.5",
    "cloud-sql-python-connector[pg8000]==1.21.0",
    "pg8000==1.31.5",
]

[tool.uv]
package = false

[tool.uv.sources]
rag-provider-adapters = { workspace = true }

[tool.fastapi]
entrypoint = "rag_api.main:app"
