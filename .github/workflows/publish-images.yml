name: Publish immutable images

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.sha }}
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned tools
        uses: jdx/mise-action@v3
        with:
          cache: true

      - name: Install locked dependencies
        run: mise run bootstrap

      - name: Run all quality gates
        run: mise run check

  publish:
    name: Build and publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment variables
        env:
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          PUBLISHER_SERVICE_ACCOUNT: ${{ vars.GCP_PUBLISHER_SERVICE_ACCOUNT }}
        run: |
          test -n "${GCP_PROJECT_ID}"
          test -n "${GCP_REGION}"
          test -n "${ARTIFACT_REPOSITORY}"
          test -n "${WORKLOAD_IDENTITY_PROVIDER}"
          test -n "${PUBLISHER_SERVICE_ACCOUNT}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PUBLISHER_SERVICE_ACCOUNT }}

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify Google Cloud impersonation
        run: gcloud auth print-access-token >/dev/null

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Publish or reuse commit images
        id: images
        run: |
          set -euo pipefail
          image_repository="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}"
          api_tag="${image_repository}/api:${GITHUB_SHA}"
          migration_tag="${image_repository}/migrations:${GITHUB_SHA}"

          lookup_image_digest() {
            image_tag="$1"

            for attempt in 1 2 3; do
              if lookup_output="$(
                gcloud artifacts docker images describe "${image_tag}" \
                  --format='value(image_summary.digest)' 2>&1
              )"; then
                printf '%s' "${lookup_output}"
                return 0
              else
                lookup_status="$?"
              fi

              if printf '%s' "${lookup_output}" |
                grep -Eq 'NOT_FOUND:|Image not found\.'; then
                return 2
              fi

              if [ "${attempt}" -eq 3 ]; then
                printf 'Artifact Registry lookup failed after %s attempts: %s\n' \
                  "${attempt}" "${lookup_output}" >&2
                return "${lookup_status}"
              fi

              sleep "$((attempt * 2))"
            done
          }

          verify_image_digest() {
            image_name="$1"
            image_digest="$2"
            printf '%s' "${image_digest}" | grep -Eq '^sha256:[0-9a-f]{64}$'
            gcloud artifacts docker images describe \
              "${image_name}@${image_digest}" \
              --format='value(image_summary.digest)' |
              grep -Fxq "${image_digest}"
          }

          api_lookup_status=0
          api_digest="$(lookup_image_digest "${api_tag}")" || api_lookup_status="$?"
          case "${api_lookup_status}" in
            0)
              verify_image_digest "${image_repository}/api" "${api_digest}"
              echo "Reusing existing immutable API image ${api_tag}."
              ;;
            2)
              docker build \
                --file apps/api/Dockerfile \
                --build-arg "APP_REVISION=${GITHUB_SHA}" \
                --tag "${api_tag}" \
                .
              docker push "${api_tag}"
              api_digest="$(lookup_image_digest "${api_tag}")"
              verify_image_digest "${image_repository}/api" "${api_digest}"
              ;;
            *)
              exit "${api_lookup_status}"
              ;;
          esac

          migration_lookup_status=0
          migration_digest="$(lookup_image_digest "${migration_tag}")" ||
            migration_lookup_status="$?"
          case "${migration_lookup_status}" in
            0)
              verify_image_digest "${image_repository}/migrations" "${migration_digest}"
              echo "Reusing existing immutable migration image ${migration_tag}."
              ;;
            2)
              docker build \
                --file apps/api/Dockerfile.migrations \
                --tag "${migration_tag}" \
                .
              docker push "${migration_tag}"
              migration_digest="$(lookup_image_digest "${migration_tag}")"
              verify_image_digest "${image_repository}/migrations" "${migration_digest}"
              ;;
            *)
              exit "${migration_lookup_status}"
              ;;
          esac

          api_image="${image_repository}/api@${api_digest}"
          migration_image="${image_repository}/migrations@${migration_digest}"
          printf 'api_image=%s\n' "${api_image}" >>"${GITHUB_OUTPUT}"
          printf 'migration_image=%s\n' "${migration_image}" >>"${GITHUB_OUTPUT}"

          jq -n \
            --arg source_revision "${GITHUB_SHA}" \
            --arg api_image "${api_image}" \
            --arg migration_image "${migration_image}" \
            --arg workflow_run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{
              source_revision: $source_revision,
              api_image: $api_image,
              migration_image: $migration_image,
              workflow_run: $workflow_run
            }' >image-manifest.json

          {
            echo "### Immutable images"
            echo
            echo "- API: \`${api_image}\`"
            echo "- Migrations: \`${migration_image}\`"
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Retain image manifest
        uses: actions/upload-artifact@v4
        with:
          name: image-manifest-${{ github.sha }}
          path: image-manifest.json
          if-no-files-found: error
          retention-days: 90
